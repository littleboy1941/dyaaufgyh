name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'sideload = our bundle id and API keys, official = stock Telegram config (control build)'
        type: choice
        options: [sideload, official]
        default: sideload

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360

    steps:
      - name: Disk space
        run: df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          # Since Xcode 26 the Metal toolchain is a separate download and some
          # runner images don't have it installed
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal -v

      - name: Move sources to canonical directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))

          # versions.json pins only the darwin-arm64 Bazel hash; on Intel fetch the
          # official x86_64 binary and verify it against the release checksum
          BAZEL_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          BAZEL="$PWD/build-input/bazel-$BAZEL_VERSION-darwin-x86_64"
          mkdir -p build-input
          curl -fsSL -o "$BAZEL" "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64"
          curl -fsSL "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64.sha256" \
            | sed "s#bazel-.*#$BAZEL#" | shasum -a 256 -c -
          chmod +x "$BAZEL"

          # The standard runner (4 CPU / 14 GB) lost connection after ~75 min of an
          # unthrottled build; keep Bazel and Swift workers from starving it.
          cat >> .bazelrc <<'EOF'
          build --jobs=3
          build --local_resources=cpu=HOST_CPUS-1
          build --local_resources=memory=HOST_RAM*.5
          build --worker_max_instances=2
          EOF

          # Resource log to diagnose runner starvation
          ( while true; do
              echo "[monitor] $(date -u +%H:%M:%S) $(sysctl -n vm.swapusage) load=$(sysctl -n vm.loadavg)"
              sleep 120
            done ) &

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          if [ "$BUILD_CONFIGURATION" = "official" ]; then
            CONFIGURATION_PATH=build-system/appstore-configuration.json
            CODESIGNING_PATH=build-system/fake-codesigning
          else
            bash build-system/sideload/prepare.sh build-input/sideload
            CONFIGURATION_PATH=build-input/sideload/configuration.json
            CODESIGNING_PATH=build-input/sideload/codesigning
          fi

          python3 -u build-system/Make/Make.py \
            --bazel="$BAZEL" \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            build \
            --configurationPath="$CONFIGURATION_PATH" \
            --codesigningInformationPath="$CODESIGNING_PATH" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

      - name: Report disk usage
        if: always()
        run: df -h /

      # Artifacts of a public repo are downloadable by anyone and the IPA embeds
      # our API keys, so only an AES-256 encrypted archive is published.
      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          test -n "$IPA_PASSWORD"
          cd /Users/Shared/telegram-ios/build/artifacts
          7z a -t7z -mhe=on -p"$IPA_PASSWORD" Telegram.ipa.7z Telegram.ipa > /dev/null
          rm Telegram.ipa
          ls -la

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-encrypted
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa.7z
          compression-level: 0
          retention-days: 3
