name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'sideload = our bundle id and API keys, official = stock Telegram config (control build)'
        type: choice
        options: [sideload, official]
        default: sideload
      mode:
        description: 'debug = fast iterations (no whole-module optimization), release = optimized'
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360

    steps:
      - name: Disk space
        run: df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow checkout of the repo and all submodules (WebRTC etc. are huge)
          fetch-depth: 1

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          # Since Xcode 26 the Metal toolchain is a separate download and some
          # runner images don't have it installed
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal -v

      - name: Move sources to canonical directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"

      # Bazel disk cache survives between runs in the GitHub cache. The key changes
      # with the toolchain/dependency pins; within a key every run saves a fresh
      # entry and the next run restores the newest one. The disk cache is content
      # addressed, so falling back to an entry with other pins is safe: unused
      # entries are pruned after the build.
      - name: Bazel cache key
        id: cache-key
        run: |
          cd /Users/Shared/telegram-ios
          HASH=$(cat versions.json MODULE.bazel.lock .bazelrc <(git ls-tree -r HEAD | grep '^160000') | shasum -a 256 | cut -c1-16)
          echo "prefix=bazel-${{ inputs.mode }}-${{ inputs.configuration }}-" >> "$GITHUB_OUTPUT"
          echo "base=bazel-${{ inputs.mode }}-${{ inputs.configuration }}-$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.base }}-
            ${{ steps.cache-key.outputs.prefix }}

      - name: Bazel cache size (restored)
        run: du -sh /Users/Shared/bazel-disk-cache 2>/dev/null || echo "no cache"

      - name: Build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          # History is shallow, so number builds by workflow run; the offset keeps
          # numbers above the first builds (3737).
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4000 ))

          # versions.json pins only the darwin-arm64 Bazel hash; on Intel fetch the
          # official x86_64 binary and verify it against the release checksum
          BAZEL_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          BAZEL="$PWD/build-input/bazel-$BAZEL_VERSION-darwin-x86_64"
          mkdir -p build-input
          curl -fsSL -o "$BAZEL" "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64"
          curl -fsSL "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64.sha256" \
            | sed "s#bazel-.*#$BAZEL#" | shasum -a 256 -c -
          chmod +x "$BAZEL"

          # The standard runner (4 CPU / 14 GB) lost connection after ~75 min of an
          # unthrottled build; keep Bazel and Swift workers from starving it.
          cat >> .bazelrc <<'EOF'
          build --jobs=3
          build --local_resources=cpu=HOST_CPUS-1
          build --local_resources=memory=HOST_RAM*.5
          build --worker_max_instances=2
          EOF

          # Resource log to diagnose runner starvation
          ( while true; do
              echo "[monitor] $(date -u +%H:%M:%S) $(sysctl -n vm.swapusage) load=$(sysctl -n vm.loadavg)"
              sleep 120
            done ) &

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          if [ "$BUILD_CONFIGURATION" = "official" ]; then
            CONFIGURATION_PATH=build-system/appstore-configuration.json
            CODESIGNING_PATH=build-system/fake-codesigning
          else
            bash build-system/sideload/prepare.sh build-input/sideload
            CONFIGURATION_PATH=build-input/sideload/configuration.json
            CODESIGNING_PATH=build-input/sideload/codesigning
          fi

          CACHE=/Users/Shared/bazel-disk-cache
          mkdir -p "$CACHE"
          (cd "$CACHE" && find . -type f | sort) > /Users/Shared/cache-before.txt
          touch /Users/Shared/cache-marker
          sleep 1

          python3 -u build-system/Make/Make.py \
            --bazel="$BAZEL" \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build \
            --configurationPath="$CONFIGURATION_PATH" \
            --codesigningInformationPath="$CODESIGNING_PATH" \
            --configuration="${BUILD_MODE}_arm64" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          # Bazel refreshes mtime on every disk cache hit: after a successful build
          # drop entries this build didn't use so the cache doesn't grow forever.
          USED=$(find "$CACHE" -type f -newer /Users/Shared/cache-marker | wc -l)
          TOTAL=$(find "$CACHE" -type f | wc -l)
          echo "Disk cache: $USED of $TOTAL files used by this build"
          # Guard: if mtimes weren't refreshed, pruning would wipe a good cache
          if [ "$USED" -gt 1000 ]; then
            find "$CACHE" -type f ! -newer /Users/Shared/cache-marker -delete
            find "$CACHE" -type d -empty -delete
          fi

      - name: Report disk usage
        if: always()
        run: df -h /

      # The whole repo gets 10 GB of cache; don't try to save an entry that can't fit.
      - name: Check Bazel cache size
        id: cache-size
        if: always()
        run: |
          KB=$(du -sk /Users/Shared/bazel-disk-cache 2>/dev/null | cut -f1)
          KB=${KB:-0}
          echo "Bazel disk cache: $((KB / 1024)) MB"
          (cd /Users/Shared/bazel-disk-cache 2>/dev/null && find . -type f | sort) > /Users/Shared/cache-after.txt || true
          if cmp -s /Users/Shared/cache-before.txt /Users/Shared/cache-after.txt; then
            echo "Cache content unchanged, nothing to save"
          elif [ "$KB" -gt 0 ] && [ "$KB" -lt $((9 * 1024 * 1024)) ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Bazel cache
        if: always() && steps.cache-size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.base }}-${{ github.run_id }}

      # Artifacts of a public repo are downloadable by anyone and the IPA embeds
      # our API keys, so only an AES-256 encrypted archive is published.
      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          test -n "$IPA_PASSWORD"
          cd /Users/Shared/telegram-ios/build/artifacts
          # The IPA is already a zip: store only (-mx=0), encryption is what matters
          7z a -t7z -mx=0 -mhe=on -p"$IPA_PASSWORD" Telegram.ipa.7z Telegram.ipa > /dev/null
          rm Telegram.ipa
          ls -la

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-encrypted
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa.7z
          compression-level: 0
          retention-days: 3
