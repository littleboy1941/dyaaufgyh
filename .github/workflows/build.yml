name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360

    steps:
      - name: Disk space
        run: df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Move sources to canonical directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))

          # versions.json pins only the darwin-arm64 Bazel hash; on Intel fetch the
          # official x86_64 binary and verify it against the release checksum
          BAZEL_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          BAZEL="$PWD/build-input/bazel-$BAZEL_VERSION-darwin-x86_64"
          mkdir -p build-input
          curl -fsSL -o "$BAZEL" "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64"
          curl -fsSL "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-x86_64.sha256" \
            | sed "s#bazel-.*#$BAZEL#" | shasum -a 256 -c -
          chmod +x "$BAZEL"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazel="$BAZEL" \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

      - name: Report disk usage
        if: always()
        run: df -h /

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          retention-days: 3
